plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aile.ekran'
    compileSdk 34

    defaultConfig {
        applicationId "com.aile.ekran"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Sabit imza anahtarı: her derlemede aynı imza çıksın diye (yoksa Android
    // güncellemeyi "farklı imza" sayıp reddeder, kurulum "uygulama yüklenmedi" der).
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
