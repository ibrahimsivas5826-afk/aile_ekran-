plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aile.ekran'
    compileSdk 34

    defaultConfig {
        applicationId "com.aile.ekran"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    // Sabit imza anahtarı: her derlemede aynı imza çıksın diye (yoksa Android
    // güncellemeyi "farklı imza" sayıp reddeder, kurulum "uygulama yüklenmedi" der).
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Eşleştirme QR kodunu üretmek için (ebeveyn tarafı, saf Java - kamera/native kod yok).
    implementation 'com.google.zxing:core:3.5.3'
    // QR okumak için: Google'ın kendi tarayıcısı, kamerayı Play Services yönetir - bizim kodumuz
    // kamerayla hiç uğraşmaz, cihaza özgü kamera çökmelerinden etkilenmez, kamera izni de gerekmez.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
