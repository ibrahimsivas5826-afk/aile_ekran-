plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aile.ekran'
    compileSdk 34

    defaultConfig {
        applicationId "com.aile.ekran"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // Sabit imza anahtarı: her derlemede aynı imza çıksın diye (yoksa Android
    // güncellemeyi "farklı imza" sayıp reddeder, kurulum "uygulama yüklenmedi" der).
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Eşleştirme QR kodu: üretmek (zxing core) ve kameradan okumak (zxing-android-embedded)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
